<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Godown Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#EEF1F4;--surf:#fff;--ink:#14213D;--mut:#5B6578;--line:#D5DBE3;--acc:#E0A100;--accink:#14213D;--ok:#2F7D5B;--bad:#B8433A;
font-family:'Hanken Grotesk',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--surf:#18223A;--ink:#EAEFF7;--mut:#9AA6BD;--line:#2B3753;--ok:#5CC596;--bad:#F08A80}}
:root[data-theme="dark"]{--bg:#0F1626;--surf:#18223A;--ink:#EAEFF7;--mut:#9AA6BD;--line:#2B3753;--ok:#5CC596;--bad:#F08A80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
header{background:#14213D;color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid #2B3753}
.bar{max-width:980px;margin:0 auto;padding:12px 16px 6px;display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:7px;background:var(--acc);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:6px;right:6px;top:8px;height:3px;background:#14213D;box-shadow:0 6px 0 #14213D,0 12px 0 #14213D}
header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;flex:1}
.dt{font-size:13px;color:#AEB9D0;white-space:nowrap}
.dlb{border:1px solid #5B6A8A;background:transparent;color:#fff;border-radius:5px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
nav{display:grid;grid-template-columns:repeat(5,1fr);max-width:980px;margin:0 auto;padding:0 8px}
nav button{border:0;background:transparent;color:#AEB9D0;font:inherit;font-size:13px;font-weight:500;padding:10px 2px 9px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;border-color:var(--acc);font-weight:700}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
main{max-width:980px;margin:0 auto;padding:16px}
h2{font-size:17px;margin:22px 0 10px}
h2:first-child{margin-top:0}
.bal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:10px 8px;text-align:center}
.cell b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.cell span{color:var(--mut);font-size:13px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
label{display:block;font-size:13px;color:var(--mut);font-weight:500}
input,select{width:100%;margin-top:3px;padding:9px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px}
button.pri{background:var(--acc);color:var(--accink);border:0;border-radius:5px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:6px 10px;font:inherit;cursor:pointer}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surf);border:1px solid var(--line);font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mut);font-weight:500}
td.n,th.n{text-align:right}
.bad{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}
.note{color:var(--mut);font-size:13px;margin:6px 0}
.prev{font-weight:700;padding:8px 0}
.empty{padding:18px;text-align:center;color:var(--mut)}
.gsw{position:relative;max-width:980px;margin:0 auto;padding:0 16px 8px}
.gsw input{margin:0;background:#fff;color:#14213D;border:0}
#gsl{display:none;position:absolute;left:16px;right:16px;top:100%;margin-top:-4px;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.3);max-height:60vh;overflow:auto;z-index:20}
#gsl button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:10px 12px;cursor:pointer}
#gsl button span{color:var(--mut);font-size:13px;display:block}
#gsl .gn{padding:10px 12px;color:var(--mut)}
#gsl button.on{background:var(--bg)}
.cc{background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px}
.cc .st{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
@media(max-width:560px){.bal{grid-template-columns:repeat(3,1fr)}}
body.r-staff button[onclick^="del("],body.r-view button[onclick^="del("],body.r-view button.pri:not([onclick^="xl("]):not([onclick^="unlock("]){display:none}
body.r-staff input[onchange^="so("],body.r-staff input[onchange^="sa("],body.r-staff input[onchange^="sl("],body.r-view input[onchange^="so("],body.r-view input[onchange^="sa("],body.r-view input[onchange^="sl("]{pointer-events:none;opacity:.7;border-color:transparent;background:transparent}
</style>

<body>
<header><div class="bar"><span class="mark"></span><h1>Godown Ledger</h1><span class="dt" id="dt"></span><button class="dlb" onclick="dlApp()" title="Download the whole application with all your data">Download app</button></div>
<div class="gsw" id="gsw"><input id="gs" placeholder="Find customer: type name, phone or place (press / to jump here)" oninput="gsr()" onfocus="gsr()" onkeydown="gk(event)" autocomplete="off" aria-label="Search customer"><div id="gsl" onmousedown="event.preventDefault()"></div></div>
<nav id="nav"></nav></header>
<main id="main"></main>
<script>
/* Connects the app to the server (and so to MongoDB Atlas). Replaces the claude.ai cloud. */
(function(){
 var KEY=localStorage.getItem('gl-key')||'',ROLE='',ready=null;
 var H=function(){return{'content-type':'application/json','x-api-key':KEY}};
 /* Asks for the key, checks it with the server and keeps it on this device. No valid key: the app uses only this device's data. */
 function login(){return ready=ready||(async function(){try{
  for(var i=0;i<3;i++){
   if(!KEY){var k=prompt('Type your Godown key (owner, staff or viewer).\nPress Cancel to use only the data saved on this device.');if(!k||!k.trim())return false;KEY=k.trim()}
   var r=await fetch('/api/whoami',{headers:H()});
   if(r.ok){ROLE=(await r.json()).role;localStorage.setItem('gl-key',KEY);return true}
   if(r.status===429){alert('Too many wrong keys from this address. Try again in 10 minutes.');return false}
   if(r.status!==401)return false;
   localStorage.removeItem('gl-key');KEY='';alert('That key is not right.')}
  return false}catch(e){return false}})()}
 async function call(m,p,b){var r=await fetch('/api/data/'+p,{method:m,headers:H(),body:b===undefined?undefined:JSON.stringify(b)});
  if(r.status===401){localStorage.removeItem('gl-key');location.reload()}
  if(!r.ok){var j={};try{j=await r.json()}catch(e){}var e=new Error(j.error||r.status);e.code=j.error||String(r.status);throw e}return r.json()}
 var L={},last={},timers={};
 var cp=function(x){return JSON.parse(JSON.stringify(x))};
 var doc1=function(x){return{id:x.id,exists:true,data:function(){return cp(x)}}};
 var snap=function(a){return{docs:a.map(doc1),metadata:{fromCache:false}}};
 async function poll(c){var a=await call('GET',c),s=JSON.stringify(a);if(last[c]&&last[c].s===s)return;last[c]={s:s,a:a};(L[c]||[]).forEach(function(f){f.ok(a)})}
 function listen(c,ok,er){(L[c]=L[c]||[]).push({ok:ok,er:er});
  if(last[c])setTimeout(function(){ok(last[c].a)},0);
  if(!timers[c]){timers[c]=setInterval(function(){poll(c).catch(function(e){(L[c]||[]).forEach(function(f){f.er&&f.er(e)})})},4000)}
  poll(c).catch(function(e){er&&er(e)})}
 var DBA={
  collection:function(c){return{
   onSnapshot:function(cb,er){listen(c,function(a){cb(snap(a))},er);return function(){}},
   get:async function(){return snap(await call('GET',c))},
   orderBy:function(){return this},limit:function(){return this}}},
  doc:function(p){var c=p.split('/')[0],id=p.split('/')[1];return{
   get:async function(){try{var x=await call('GET',c+'/'+id);return{exists:true,data:function(){return cp(x)}}}catch(e){if(e.code==='Not found')return{exists:false,data:function(){return undefined}};throw e}},
   set:async function(v){await call('PUT',c+'/'+id,v);poll(c).catch(function(){})},
   delete:async function(){await call('DELETE',c+'/'+id);poll(c).catch(function(){})},
   onSnapshot:function(cb,er){listen(c,function(a){var x=a.find(function(d){return d.id===id});cb({exists:!!x,data:function(){return x&&cp(x)},metadata:{fromCache:false}})},er);return function(){}}}}};
 window.claude={use:async function(n){
  if(!await login())return null;
  if(n==='user')return{id:async function(){return ROLE+'-user'},isOwner:async function(){return ROLE==='owner'},canEdit:async function(){return false},can:async function(){return ROLE!=='view'}};
  if(n==='db')return DBA;return null}};
})();
</script>
<script>
const G=['AAAA','AAA','AA','A','Kali'];
const T=['Godown','Sales','Customers','Lines','Reports'];
let LC='',tab='Godown',F={from:'',to:'',route:'',grade:''};
const blank=()=>({cust:[],moves:[],sales:[],pays:[]});
let S;
try{S=JSON.parse(localStorage.getItem('godown-ledger')||'null')||blank()}catch(e){S=blank()}
try{const sd=document.getElementById('seed');if(sd&&!localStorage.getItem('gl-seeded')&&!localStorage.getItem('godown-enc')&&!((S.cust||[]).length||(S.sales||[]).length||(S.moves||[]).length)){S=Object.assign(blank(),JSON.parse(sd.textContent));localStorage.setItem('gl-seeded','1');localStorage.setItem('godown-ledger',JSON.stringify(S))}}catch(e){}
const save=()=>{if(OWN){try{if(CK)encStore();else if(!getPin())localStorage.setItem('godown-ledger',JSON.stringify(S))}catch(e){}}if(typeof cloudQueue==='function'){cloudQueue();pushQ()}};
function defSched(){return{MON:{l:'DRM',o:157866},TUE:{l:'YEL',o:90574},WED:{l:'AMP',o:80552},THU:{l:'',o:0},FRI:{l:'PTP',o:552088},SAT:{l:'KKD',o:352946}}}
if(!S.sched)S.sched=defSched();
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const num=n=>(Math.round(n*100)/100).toLocaleString('en-IN');
const $=id=>document.getElementById(id);
const v=id=>$(id).value;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let BC=null,CM=null;
const cu=id=>(CM?CM.get(id):S.cust.find(c=>c.id===id))||{name:'(deleted)',route:'',loc:''};
const opts=(a,sel)=>a.map(x=>`<option${x===sel?' selected':''}>${esc(x)}</option>`).join('');
const routes=()=>[...new Set(S.cust.map(c=>c.route).filter(Boolean).concat(S.moves.map(m=>m.route).filter(Boolean)))].sort();
const bill=s=>s.qty*s.price;
function bal(id){if(BC){if(!BC.t){BC.t={};S.sales.forEach(s=>BC.t[s.cid]=(BC.t[s.cid]||0)+bill(s)-s.paid);S.pays.forEach(p=>BC.t[p.cid]=(BC.t[p.cid]||0)-p.amt)}return(cu(id).open||0)+(BC.t[id]||0)}return(cu(id).open||0)+S.sales.filter(s=>s.cid===id).reduce((a,s)=>a+bill(s)-s.paid,0)-S.pays.filter(p=>p.cid===id).reduce((a,p)=>a+p.amt,0)}
function stock(g){let t=0;S.moves.forEach(m=>{if(m.grade!==g)return;t+=m.type==='dispatch'?-m.qty:m.qty});return t}
function avgCost(g){const i=S.moves.filter(m=>m.grade===g&&m.type==='inward'&&m.cost>0);const q=i.reduce((a,m)=>a+m.qty,0);return q?i.reduce((a,m)=>a+m.qty*m.cost,0)/q:0}
function nav(){$('dt').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});$('nav').innerHTML=T.map(t=>`<button class="${t===tab?'on':''}" onclick="go('${t}')">${t}</button>`).join('')}
function go(t){$('gsl').style.display='none';tab=t;render()}
function render(){if(!unlocked){lockView();return}$('gsw').style.display='';nav();document.body.className='r-'+ROLE;BC={};CM=new Map(S.cust.map(c=>[c.id,c]));try{$('main').innerHTML=banner()+({Godown:vGodown,Sales:vSales,Customers:vCust,Lines:vLines,Reports:vRep,Detail:vDetail})[tab]()}finally{BC=null;CM=null}window.scrollTo(0,0)}

/* Godown */
function vGodown(){return vGodown0()+(OWN?cloudPanel():'')+logPanel()+`<h2>Backup</h2><div class="panel"><p class="note" style="margin-top:0">Your data lives in this browser only. Copy a backup now and then, and paste it back to restore.</p><button class="ghost" onclick="bk()">Show backup text</button> <button class="ghost" onclick="dlJson()">Download full backup (.json)</button> <button class="ghost" onclick="dlApp()">Download the application with all my data (.html)</button><div id="bk"></div></div>`}
function bk(){$('bk').innerHTML='<textarea id="bt" rows="5" style="width:100%;margin-top:10px"></textarea><button class="ghost" onclick="rs()">Restore from this text</button>';$('bt').value=JSON.stringify(S);$('bt').select()}
function rs(){if(!need())return;try{const d=JSON.parse(v('bt'));if(!d.cust||!d.sales)throw 0;if(!confirm('Replace all current data with this backup?'))return;const lg=S.log||[],sn=S.seen;S=Object.assign(blank(),d);S.log=lg;S.seen=sn;if(!S.sched)S.sched=defSched();logE('Data restored from a backup');save();render()}catch(e){alert('That text is not a valid backup.')}}
function vGodown0(){
 const d=today(),rs=routes();
 const rec=rs.map(r=>{const m=S.moves.filter(x=>x.date===d&&x.route===r);
  const dis=m.filter(x=>x.type==='dispatch').reduce((a,x)=>a+x.qty,0),ret=m.filter(x=>x.type==='return').reduce((a,x)=>a+x.qty,0);
  const sold=S.sales.filter(s=>s.date===d&&cu(s.cid).route===r).reduce((a,s)=>a+s.qty,0);
  return{r,dis,ret,sold,gap:dis-ret-sold}}).filter(x=>x.dis||x.ret||x.sold);
 return `<h2>Stock in godown (kg)</h2>
 <div class="bal">${G.map(g=>`<div class="cell"><b class="${stock(g)<0?'bad':''}">${num(stock(g))}</b><span>${g}</span></div>`).join('')}</div>
 <h2>Add stock movement</h2>
 <div class="panel"><div class="row">
 <label>Type<select id="mt" onchange="mtc()"><option value="dispatch">Morning dispatch</option><option value="return">Evening return</option><option value="inward">New load received</option></select></label>
 <label>Date<input id="md" type="date" value="${d}"></label>
 <label id="mrw">Route<input id="mr" list="rl" placeholder="e.g. Line 1"><datalist id="rl">${rs.map(r=>`<option>${esc(r)}</option>`).join('')}</datalist></label>
 <label>Grade<select id="mg">${opts(G)}</select></label>
 <label>Quantity (kg)<input id="mq" type="number" min="0" step="any"></label>
 <label id="mcw" style="display:none">Cost per kg (₹)<input id="mc" type="number" min="0" step="any"></label>
 <button class="pri" onclick="addMove()">Save movement</button></div></div>
 <h2>Today’s route check</h2>
 ${rec.length?`<div class="wrap"><table><tr><th>Route</th><th class="n">Dispatched</th><th class="n">Returned</th><th class="n">Sold</th><th class="n">Difference</th></tr>${rec.map(x=>`<tr><td>${esc(x.r)}</td><td class="n">${num(x.dis)}</td><td class="n">${num(x.ret)}</td><td class="n">${num(x.sold)}</td><td class="n ${Math.abs(x.gap)<.01?'ok':'bad'}">${num(x.gap)}</td></tr>`).join('')}</table></div><p class="note">Difference = dispatched − returned − sold. Anything other than 0 needs checking.</p>`:'<div class="panel empty">No dispatch or sales logged today.</div>'}
 <h2>Recent movements</h2>
 ${S.moves.length?`<div class="wrap"><table><tr><th>Date</th><th>Type</th><th>Route</th><th>Grade</th><th class="n">kg</th><th class="n">Cost/kg</th><th></th></tr>${[...S.moves].reverse().slice(0,25).map(m=>`<tr><td>${m.date}</td><td>${{dispatch:'Dispatch',return:'Return',inward:'New load'}[m.type]}</td><td>${esc(m.route||'')}</td><td>${m.grade}</td><td class="n">${num(m.qty)}</td><td class="n">${m.cost?num(m.cost):''}</td><td><button class="ghost" onclick="del('moves','${m.id}')">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="panel empty">Nothing yet. Log your first new load to set opening stock.</div>'}
 ${S.cust.length?'':'<p class="note"><button class="ghost" onclick="sample()">Load sample data</button> to try the app.</p>'}`}
function mtc(){const t=v('mt');$('mrw').style.display=t==='inward'?'none':'';$('mcw').style.display=t==='inward'?'':'none'}
function addMove(){if(!can())return;const q=parseFloat(v('mq')),t=v('mt');
 if(!(q>0))return alert('Enter a quantity above 0.');
 if(t!=='inward'&&!v('mr').trim())return alert('Enter the route for this movement.');
 if(dbl('m'+t+v('md')+v('mr')+v('mg')+q))return;S.moves.push({id:uid(),type:t,date:v('md')||today(),route:t==='inward'?'':v('mr').trim(),grade:v('mg'),qty:q,cost:t==='inward'?(parseFloat(v('mc'))||0):0});logE(`Added ${{dispatch:'dispatch',return:'return',inward:'new load'}[t]}: ${q} kg ${v('mg')} ${v('mr').trim()}`);save();render()}
function del(k,id){if(!need())return;if(!confirm('Delete this entry?'))return;const it=S[k].find(x=>x.id===id);logE('Deleted from '+k+': '+JSON.stringify(it));S[k]=S[k].filter(x=>x.id!==id);save();render()}

/* Sales */
function vSales(){
 if(!S.cust.length)return `<div class="panel empty">Add customers first, then record sales.<br><br><button class="pri" onclick="go('Customers')">Add customers</button></div>`;
 const rts=[...new Set(S.cust.map(c=>c.route))].sort();if(SR!=='*'&&!rts.includes(SR))SR=rts[0]||'';
 return `<h2>New sale</h2><div class="panel"><div class="row">
 <label>Route<select id="sr" onchange="srch(this.value)"><option value="*"${SR==='*'?' selected':''}>All routes</option>${rts.map(r=>`<option${r===SR?' selected':''}>${esc(r)}</option>`).join('')}</select></label>
 <label>Customer <span class="note" id="scn">(${cl(SR,'').length})</span><select id="sc" onchange="SC=this.value;prev()">${custOpts(SR,'',0,SC)}</select></label>
 <label>Date<input id="sd" type="date" value="${today()}"></label>
 <label>Grade<select id="sg" onchange="lastPrice()">${opts(G)}</select></label>
 <label>Quantity (kg)<input id="sq" type="number" min="0" step="any" oninput="prev()"></label>
 <label>Price per kg (₹)<input id="sp" type="number" min="0" step="any" oninput="prev()"></label>
 <label>Paid now (₹)<input id="spd" type="number" min="0" step="any" value="0" oninput="prev()"></label>
 <label>Paid by<select id="sm"><option>Cash</option><option>UPI</option></select></label></div>
 <div id="cd" style="margin:10px 0">${custCard(SC||(cl(SR,'')[0]||{}).id)}</div><div class="prev" id="pv"></div><button class="pri" onclick="addSale()">Save sale</button></div>
 <h2>Recent sales</h2>
 ${S.sales.length?salesTable():false?`<div class="wrap"><table><tr><th>Date</th><th>Customer</th><th>Grade</th><th class="n">kg</th><th class="n">Price</th><th class="n">Bill</th><th class="n">Paid</th><th class="n">Pending</th><th class="n">Customer total due now</th><th></th></tr>${[...S.sales].reverse().slice(0,30).map(s=>`<tr><td>${s.date}</td><td>${esc(cu(s.cid).name)}</td><td>${s.grade}</td><td class="n">${num(s.qty)}</td><td class="n">${num(s.price)}</td><td class="n">${inr(bill(s))}</td><td class="n">${inr(s.paid)} ${s.paid?s.mode:''}</td><td class="n ${bill(s)-s.paid>0?'bad':''}">${inr(bill(s)-s.paid)}</td><td class="n">${inr(bal(s.cid))}</td><td><button class="ghost" onclick="del('sales','${s.id}')">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="panel empty">No sales yet.</div>'}`}
function prevDue(cid,d){return(cu(cid).open||0)+S.sales.filter(s=>s.cid===cid&&s.date<d).reduce((a,s)=>a+bill(s)-s.paid,0)-S.pays.filter(p=>p.cid===cid&&p.date<d).reduce((a,p)=>a+p.amt,0)}
function salesTable(){const m=new Map();[...S.sales].reverse().forEach(s=>{const k=s.date+'|'+s.cid;if(!m.has(k))m.set(k,{date:s.date,cid:s.cid,a:[]});m.get(k).a.push(s)});
 const gs=[...m.values()].sort((x,y)=>y.date.localeCompare(x.date)).slice(0,30);

function lineCr(d){const x=S.sched[d];if(!x||!x.l)return 0;const k=x.l.trim().toLowerCase();return x.o+S.cust.filter(c=>c.route.trim().toLowerCase()===k).reduce((a,c)=>a+bal(c.id)-(c.open||0),0)}
function vLines(){const ti=new Date().getDay()-1;let gt=0;
 const rows=DAYS.map((d,i)=>{const x=S.sched[d]||{l:'',o:0},t=lineCr(d);gt+=t;const n=x.l?S.cust.filter(c=>c.route.trim().toLowerCase()===x.l.trim().toLowerCase()).length:0;const un=x.l?x.o-S.cust.filter(c=>c.route.trim().toLowerCase()===x.l.trim().toLowerCase()).reduce((a,c)=>a+(c.open||0),0):0;
 return `<tr style="${i===ti?'background:var(--bg)':''}"><td><b>${d}</b>${i===ti?' <span class="note">today</span>':''}</td><td><input aria-label="Line for ${d}" value="${esc(x.l)}" style="width:90px;margin:0" onchange="sl('${d}','l',this.value)"></td><td class="n"><input aria-label="Starting credit for ${d}" type="number" min="0" value="${x.o||''}" style="width:120px;margin:0;text-align:right" onchange="sl('${d}','o',this.value)"></td><td class="n"><b>${x.l?inr(t):''}</b></td><td class="n">${n}</td><td class="n ${un<0?'bad':''}">${x.l?inr(un):''}</td></tr>`}).join('');
 return `<h2>Weekly lines and credit</h2><div class="wrap"><table><tr><th>Day</th><th>Line</th><th class="n">Starting credit (₹)</th><th class="n">T credit</th><th class="n">Customers</th><th class="n">Old pending not yet given to customers</th></tr>${rows}<tr><td colspan="3"><b>Grand total</b></td><td class="n"><b>${inr(gt)}</b></td><td></td><td></td></tr></table></div>
 <p class="note">Set the line name for each day and the credit already pending on that line. T credit = starting credit + new unpaid sales − payments collected from customers whose route matches the line name (for example DRM). When you enter a customer’s old pending in the Customers tab, it is counted inside the line’s starting credit, not added twice, and the last column shows how much is still not given to any customer. Leave a day’s line empty for a holiday.</p>`}
function sl(d,k,val){if(!need())return;S.sched[d]=S.sched[d]||{l:'',o:0};S.sched[d][k]=k==='o'?(parseFloat(val)||0):val.trim();logE('Line '+d+(k==='o'?' starting credit':' name')+' changed to '+val);save();render()}

/* Reports */
function vRep(){
 const ss=S.sales.filter(s=>(!F.from||s.date>=F.from)&&(!F.to||s.date<=F.to)&&(!F.grade||s.grade===F.grade)&&(!F.route||cu(s.cid).route===F.route));
 const ps=S.pays.filter(p=>(!F.from||p.date>=F.from)&&(!F.to||p.date<=F.to)&&(!F.route||cu(p.cid).route===F.route));
 const gain=s=>{const c=avgCost(s.grade);return c?s.qty*(s.price-c):0};
 const by=(arr,k)=>{const m={};arr.forEach(x=>{(m[k(x)]=m[k(x)]||[]).push(x)});return m};
 const rr=Object.entries(by(ss,s=>cu(s.cid).route||'–')).map(([r,a])=>{
  const col=a.reduce((x,s)=>x+s.paid,0)+ps.filter(p=>cu(p.cid).route===r).reduce((x,p)=>x+p.amt,0);
  const out=S.cust.filter(c=>c.route===r).reduce((x,c)=>x+bal(c.id),0);
  return{r,kg:a.reduce((x,s)=>x+s.qty,0),b:a.reduce((x,s)=>x+bill(s),0),col,out}});
 const cr=Object.entries(by(ss,s=>s.cid)).map(([id,a])=>{const g=by(a,s=>s.grade);
  const fav=Object.entries(g).sort((x,y)=>y[1].reduce((q,s)=>q+s.qty,0)-x[1].reduce((q,s)=>q+s.qty,0))[0][0];
  const kg=a.reduce((x,s)=>x+s.qty,0),b=a.reduce((x,s)=>x+bill(s),0);
  return{n:cu(id).name,o:new Set(a.map(s=>s.date)).size,kg,b,avg:b/kg,fav,gain:a.reduce((x,s)=>x+gain(s),0)}}).sort((x,y)=>y.b-x.b);
 const mo=Object.entries(by(ss,s=>s.date.slice(0,7))).sort();
 const f=`<div class="panel"><div class="row">
 <label>From<input type="date" id="ff" value="${F.from}" onchange="flt()"></label>
 <label>To<input type="date" id="ft" value="${F.to}" onchange="flt()"></label>
 <label>Route<select id="fr" onchange="flt()"><option value="">All</option>${opts(routes(),F.route)}</select></label>
 <label>Grade<select id="fg" onchange="flt()"><option value="">All</option>${opts(G,F.grade)}</select></label>
 <label>Export<select id="fx"><option value="sales">Sales</option><option value="moves">Stock movements</option><option value="pays">Payments</option><option value="cust">Customers and balances</option></select></label><button class="ghost" onclick="csv()">Copy for Excel</button> <button class="pri" onclick="xl()">Download Excel (.xlsx)</button></div><div id="csvbox"></div></div>`;
 if(!ss.length)return `<h2>Reports</h2>${f}<div class="panel empty" style="margin-top:14px">No sales match these filters.</div>`;
 return `<h2>Reports</h2>${f}
 <h2>By route</h2><div class="wrap"><table><tr><th>Route</th><th class="n">kg sold</th><th class="n">Sales</th><th class="n">Collected</th><th class="n">Outstanding now</th></tr>${rr.map(x=>`<tr><td>${esc(x.r)}</td><td class="n">${num(x.kg)}</td><td class="n">${inr(x.b)}</td><td class="n">${inr(x.col)}</td><td class="n ${x.out>0?'bad':''}">${inr(x.out)}</td></tr>`).join('')}</table></div>
 <h2>By customer</h2><div class="wrap"><table><tr><th>Customer</th><th class="n">Buying days</th><th class="n">kg</th><th class="n">Sales</th><th class="n">Avg ₹/kg</th><th>Prefers</th><th class="n">Gain</th></tr>${cr.map(x=>`<tr><td>${esc(x.n)}</td><td class="n">${x.o}</td><td class="n">${num(x.kg)}</td><td class="n">${inr(x.b)}</td><td class="n">${num(x.avg)}</td><td>${x.fav}</td><td class="n">${x.gain?inr(x.gain):'–'}</td></tr>`).join('')}</table></div>
 <p class="note">Gain uses the average cost per kg of each grade from your new-load entries. It shows – until a cost is entered.</p>
 <h2>kg sold by month and grade</h2><div class="wrap"><table><tr><th>Month</th>${G.map(g=>`<th class="n">${g}</th>`).join('')}</tr>${mo.map(([m,a])=>`<tr><td>${m}</td>${G.map(g=>`<td class="n">${num(a.filter(s=>s.grade===g).reduce((x,s)=>x+s.qty,0))}</td>`).join('')}</tr>`).join('')}</table></div>`}
function flt(){F={from:v('ff'),to:v('ft'),route:v('fr'),grade:v('fg')};render()}
function csv(){const k=v('fx'),D={sales:[['date','customer','route','grade','kg','price','bill','paid','mode','pending']].concat(S.sales.map(s=>[s.date,cu(s.cid).name,cu(s.cid).route,s.grade,s.qty,s.price,bill(s),s.paid,s.mode,bill(s)-s.paid])),moves:[['date','type','route','grade','kg','cost per kg']].concat(S.moves.map(m=>[m.date,m.type,m.route,m.grade,m.qty,m.cost])),pays:[['date','customer','route','amount','mode']].concat(S.pays.map(p=>[p.date,cu(p.cid).name,cu(p.cid).route,p.amt,p.mode])),cust:[['name','phone','location','address','route','outstanding']].concat(S.cust.map(c=>[c.name,c.phone||'',c.loc,c.addr||'',c.route,bal(c.id)]))};
 const t=D[k].map(r=>r.join('\t')).join('\n');
 const b=$('csvbox');b.innerHTML='<p class="note">Copy this into Excel or Google Sheets.</p><textarea id="ct" rows="5" style="width:100%"></textarea>';
 $('ct').value=t;$('ct').select();try{navigator.clipboard.writeText(t).then(()=>{b.firstChild.textContent='Copied. Paste it into Excel or Google Sheets.'})}catch(e){}}

function sample(){if(!need())return;const d=today(),y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 const a=uid(),b=uid(),c=uid();
 S.cust=[{id:a,name:'Ramesh Traders',loc:'Market Road',route:'Line 1'},{id:b,name:'Lakshmi Stores',loc:'Gandhi Nagar',route:'Line 1'},{id:c,name:'Sai Fruits',loc:'Bus Stand',route:'Line 2'}];
 S.moves=[...G.map((g,i)=>({id:uid(),type:'inward',date:y,route:'',grade:g,qty:500-i*60,cost:60-i*8})),
  {id:uid(),type:'dispatch',date:d,route:'Line 1',grade:'AAA',qty:80,cost:0},{id:uid(),type:'return',date:d,route:'Line 1',grade:'AAA',qty:10,cost:0}];
 S.sales=[{id:uid(),date:d,cid:a,grade:'AAA',qty:45,price:72,paid:2000,mode:'UPI'},{id:uid(),date:d,cid:b,grade:'AAA',qty:25,price:70,paid:0,mode:'Cash'},{id:uid(),date:y,cid:c,grade:'AA',qty:30,price:60,paid:1800,mode:'Cash'}];
 S.pays=[];logE('Sample data loaded');save();render()}
render();
</script>
